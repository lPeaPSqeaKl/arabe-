name: Publier une version
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la version (tag = version du manifest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(jq -r .version manifest.json)
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" main.js manifest.json styles.css --clobber
          else
            gh release create "$V" main.js manifest.json styles.css --title "$V" --notes "Atelier arabe $V"
          fi
